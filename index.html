<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奶了个蛙 · 羊了个羊玩法</title>
<style>
  :root{
    --amber:#ffb300; --amber2:#ff9800; --orange:#ff7043;
    --cream:#fff8e1; --paper:#fffef7;
    --ink:#4a2e00; --ink2:#7a5a1e;
    --face1:#fffef7; --face2:#fff3d6; --face-line:#ffe0a3;
    --shadow:0 4px 10px rgba(120,70,0,.18);
    --shadow-up:0 8px 18px rgba(120,70,0,.28);
    --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    background:linear-gradient(180deg,#fff8e1 0%,#ffe9b8 60%,#ffdf9e 100%);
    color:var(--ink);
    font-family:var(--font);
    touch-action:manipulation;
    overflow-x:hidden;
  }
  #app{max-width:600px;margin:0 auto;padding:14px 14px 40px;-webkit-user-select:none;user-select:none}

  header{text-align:center;margin-bottom:10px}
  header h1{margin:0;font-size:20px;letter-spacing:.02em}
  header .sub{margin:2px 0 0;color:var(--ink2);font-size:11px}

  .diff{display:flex;justify-content:center;gap:8px;margin:8px 0 8px}
  .diff-btn{
    flex:0 0 auto;padding:7px 18px;border:2px solid var(--face-line);
    background:var(--paper);color:var(--ink2);font-size:14px;font-weight:600;
    border-radius:999px;cursor:pointer;font-family:var(--font);transition:.15s;
  }
  .diff-btn.active{background:linear-gradient(120deg,var(--amber),var(--orange));border-color:var(--orange);color:#fff;box-shadow:var(--shadow)}

  .stats{display:flex;justify-content:center;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .stats b{color:var(--ink);font-size:14px}

  #boardWrap{
    display:flex;justify-content:center;overflow:hidden;
    margin:4px 0 2px;
    background:radial-gradient(ellipse at 50% 38%,rgba(255,255,255,.55),rgba(255,179,0,.06) 70%);
    border-radius:16px;
  }
  #board{position:relative;flex:0 0 auto;transform-origin:center top;will-change:transform}

  .tile{position:absolute}
  .tile .face{
    position:absolute;inset:3px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--face1),var(--face2));
    border:2px solid var(--face-line);
    box-shadow:var(--shadow);
    transition:transform .1s ease,filter .15s ease;
    overflow:hidden;
  }
  .tile .face img{width:100%;height:100%;object-fit:cover;border-radius:9px}
  .tile .face .emoji{font-size:28px;line-height:1}
  .tile:not(.clickable) .face{
    filter:grayscale(.5) brightness(.58) saturate(.75);
    border-color:#d9d0bf;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06), 0 2px 4px rgba(120,70,0,.12);
  }
  .tile.clickable{cursor:pointer}
  .tile.clickable .face{
    border-color:#ffb300;
    box-shadow:0 0 0 2px rgba(255,179,0,.55), var(--shadow-up);
  }
  .tile.clickable:hover .face{transform:scale(1.05)}
  .tile.clickable:active .face,
  .tile.clickable.pressed .face{transform:scale(.92)}

  .hint{text-align:center;color:var(--ink2);font-size:11px;margin:7px 0}

  #slot{
    display:flex;justify-content:center;gap:6px;
    background:linear-gradient(180deg,#fff3d6,#ffe9b8);
    border:2px solid var(--face-line);border-radius:14px;
    padding:8px;min-height:66px;margin:2px 0 14px;
  }
  .slot-cell{
    position:relative;width:52px;height:58px;border-radius:9px;
    border:2px dashed #e7c37a;background:rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;
  }
  .slot-cell.filled{border-style:solid;border-color:var(--face-line);
    background:linear-gradient(160deg,var(--face1),var(--face2));box-shadow:var(--shadow)}
  .slot-cell img{width:100%;height:100%;object-fit:cover;border-radius:7px}
  .slot-cell .emoji{font-size:26px;line-height:1}
  .slot-cell.landing img,
  .slot-cell.landing .emoji{animation:land .2s cubic-bezier(.34,1.56,.64,1)}
  .slot-cell.matching img,
  .slot-cell.matching .emoji{animation:matchPop .3s cubic-bezier(.34,1.56,.64,1) forwards}

  @keyframes land{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes matchPop{
    0%{transform:scale(1);filter:none}
    40%{transform:scale(1.3);filter:brightness(1.3) drop-shadow(0 0 12px #ffd54f)}
    70%{transform:scale(.9) rotate(-4deg)}
    100%{transform:scale(0);opacity:0;filter:brightness(1.7)}
  }

  .fly-clone{
    position:fixed;z-index:200;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,var(--face1),var(--face2));
    border:2px solid var(--face-line);border-radius:11px;
    box-shadow:0 12px 24px rgba(120,70,0,.35);
    transition:left .17s cubic-bezier(.2,.7,.3,1),top .17s cubic-bezier(.2,.7,.3,1),transform .17s cubic-bezier(.2,.7,.3,1);
  }
  .fly-clone img{width:100%;height:100%;object-fit:cover;border-radius:9px}
  .fly-clone .emoji{font-size:26px;line-height:1}

  .match-ghost{
    position:fixed;z-index:205;pointer-events:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;border-radius:9px;
    animation:matchPop .32s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  .match-ghost img{width:100%;height:100%;object-fit:cover;border-radius:7px}
  .match-ghost .emoji{font-size:26px;line-height:1}

  .burst{position:fixed;width:8px;height:8px;border-radius:50%;z-index:210;pointer-events:none;
    animation:burstFly .42s ease-out forwards}
  @keyframes burstFly{
    0%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}
  }

  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .tools button{
    position:relative;padding:10px 16px;border:2px solid var(--face-line);
    background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;
    border-radius:12px;cursor:pointer;font-family:var(--font);transition:.12s;
    box-shadow:var(--shadow);
  }
  .tools button:active{transform:translateY(1px)}
  .tools button.off{opacity:.45}
  .tools .use{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:18px;height:18px;padding:0 5px;margin-left:5px;
    background:var(--orange);color:#fff;border-radius:999px;font-size:11px;
  }
  #restart{background:linear-gradient(120deg,var(--amber),var(--orange));border-color:var(--orange);color:#fff}

  #mute{
    position:fixed;top:10px;right:10px;z-index:60;width:42px;height:42px;
    border-radius:50%;border:2px solid var(--face-line);background:rgba(255,255,255,.85);
    font-size:19px;cursor:pointer;box-shadow:var(--shadow);font-family:var(--font);
  }

  #overlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(60,35,0,.45);z-index:50;padding:20px;
  }
  #overlay .card{
    background:var(--paper);border-radius:18px;padding:26px 24px;text-align:center;
    max-width:320px;width:100%;box-shadow:0 20px 50px rgba(60,35,0,.35);
  }
  #ov-title{font-size:22px;font-weight:700;margin-bottom:6px}
  #ov-msg{color:var(--ink2);font-size:14px;margin-bottom:18px}
  #overlay .btns{display:flex;gap:10px;justify-content:center}
  #overlay button{
    padding:10px 20px;border-radius:12px;border:none;font-size:15px;font-weight:600;
    cursor:pointer;font-family:var(--font);
  }
  #ov-revive{background:linear-gradient(120deg,#42c0ff,#4c9dff);color:#fff}
  #ov-restart{background:linear-gradient(120deg,var(--amber),var(--orange));color:#fff}
  #ov-close{background:none;color:var(--ink2);font-size:13px;margin-top:12px;text-decoration:underline}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🐸 奶了个蛙</h1>
    <div class="sub">羊了个羊玩法 · 奶蛙主题 —— 凑齐三张就消除</div>
  </header>

  <div class="diff">
    <button class="diff-btn active" data-level="easy">简单</button>
    <button class="diff-btn" data-level="standard">标准</button>
    <button class="diff-btn" data-level="hell">地狱</button>
  </div>

  <div class="stats">
    <span>剩余 <b id="stat-left">0</b> 张</span>
    <span>已消 <b id="stat-cleared">0</b> / <b id="stat-total">0</b></span>
  </div>

  <div id="boardWrap"><div id="board"></div></div>
  <div class="hint">点上面的牌进卡槽 · 卡槽里凑齐 3 张相同自动消除 · 卡槽塞满 7 张就失败</div>

  <div id="slot"></div>

  <div class="tools">
    <button id="undo">↩ 撤回<span class="use">3</span></button>
    <button id="shuffle">🔀 洗牌<span class="use">3</span></button>
    <button id="revive">🫧 复活<span class="use">1</span></button>
    <button id="restart">🔁 重新开始</button>
  </div>
</div>

<button id="mute" title="音效开关">🔊</button>

<div id="overlay">
  <div class="card">
    <div id="ov-title"></div>
    <div id="ov-msg"></div>
    <div class="btns">
      <button id="ov-revive">🫧 复活</button>
      <button id="ov-restart">🔁 再来一局</button>
    </div>
    <button id="ov-close">关闭，继续用道具</button>
  </div>
</div>

<script>
/* ==================================================================
   牌面图片：已从「奶蛙.jpg」中自动抠出 11 个奶蛙表情包，放在 images/ 下。
   想替换：直接覆盖 images/1.png ~ 11.png 即可（png/jpg/webp 均可）。
   各难度用几张：简单 1~8，标准 1~10，地狱 1~11。
   图片始终优先显示真实图；仅当某张图真的加载失败时才用 emoji 兜底。
   ================================================================== */
const TILE_IMAGES = [
  'images/1.png', 'images/2.png', 'images/3.png', 'images/4.png',
  'images/5.png', 'images/6.png', 'images/7.png', 'images/8.png',
  'images/9.png', 'images/10.png', 'images/11.png'
];
// 图片缺失时的 emoji 兜底（保证没图也能玩）
const TILE_EMOJI = ['🐸','🍼','⭐','🥚','🍑','🍭','🎈','🧧','🌟','🍬','🍓','🌿'];

/* ---- 难度配置：counts 从下往上给出每层张数，叠成蜂窝菱形金字塔 ----
   copies 必须是 3 的倍数（凑三张才消除），且 types×copies === 总张数。
   地狱：6 层深埋 + 重叠覆盖判定，接近原版的「经常过不去」难度。 ---- */
const LEVELS = {
  easy:     { name:'简单', counts:[24, 15, 9],                      types:8,  copies:6  },
  standard: { name:'标准', counts:[30, 26, 22, 18, 14, 10],         types:10, copies:12 },
  hell:     { name:'地狱', counts:[28, 25, 23, 21, 19, 17, 16, 16], types:11, copies:15 }
};

const CELL_W = 66, CELL_H = 74, DEPTH = 9, PAD = 20, SLOT_MAX = 7;

const state = {
  level:'easy', tiles:[], slot:[], over:false, won:false,
  undosLeft:3, shufflesLeft:3, revivesLeft:1
};
let boardW = 0, boardH = 0;

const $ = id => document.getElementById(id);

function shuffleArr(a){
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// 生成一层「由中心向外」的圆润菱形簇（正好 target 张），避免整块长方形的密集感
function layerCells(target){
  const all = [];
  const R = Math.ceil(Math.sqrt(target)) + 1;
  for (let gy=-R; gy<=R; gy++){
    for (let gx=-R; gx<=R; gx++){
      // 椭圆距离：横向权重更高 → 牌堆更「瘦高」，更像原版竖金字塔，牌面也能更大
      const d = Math.sqrt((gx*1.2)*(gx*1.2) + gy*gy);
      all.push({gx, gy, d});
    }
  }
  all.sort((a,b)=>a.d-b.d);
  return all.slice(0, target).map(c=>({gx:c.gx, gy:c.gy}));
}
function jitter(){ return (Math.random()*2-1)*1.5; }

function buildLevel(levelKey){
  const cfg = LEVELS[levelKey];
  const tiles = [];
  let id = 0;
  cfg.counts.forEach((target, li) => {
    layerCells(target).forEach(c => {
      // 奇数行横向错开半格 → 蜂窝堆叠，摆脱呆板方格
      const gx = c.gx + ((c.gy & 1) ? 0.5 : 0);
      tiles.push({
        id:id++, col:c.gx, row:c.gy, layer:li,
        gx, gy:c.gy,
        type:0, removed:false, clickable:true, el:null
      });
    });
  });
  // 类型池：types 种 × copies 张，保证总数是 3 的倍数
  const pool = [];
  for (let t=0;t<cfg.types;t++) for (let k=0;k<cfg.copies;k++) pool.push(t);
  shuffleArr(pool);
  tiles.forEach((t,i)=>t.type=pool[i]);
  // 像素定位：含蜂窝错位 + 轻微随机抖动，再按真实包围盒平移居中
  let minGX=Infinity,maxGX=-Infinity,minGY=Infinity,maxGY=-Infinity,maxLayer=0;
  tiles.forEach(t=>{
    minGX=Math.min(minGX,t.gx); maxGX=Math.max(maxGX,t.gx);
    minGY=Math.min(minGY,t.gy); maxGY=Math.max(maxGY,t.gy);
    maxLayer=Math.max(maxLayer,t.layer);
  });
  tiles.forEach(t=>{
    t.px = (t.gx-minGX)*CELL_W + jitter();
    t.py = (t.gy-minGY)*CELL_H + (maxLayer-t.layer)*DEPTH + jitter();
  });
  let minPX=Infinity,maxPX=-Infinity,minPY=Infinity,maxPY=-Infinity;
  tiles.forEach(t=>{
    minPX=Math.min(minPX,t.px); maxPX=Math.max(maxPX,t.px+CELL_W);
    minPY=Math.min(minPY,t.py); maxPY=Math.max(maxPY,t.py+CELL_H);
  });
  boardW = (maxPX-minPX) + PAD*2;
  boardH = (maxPY-minPY) + PAD*2;
  tiles.forEach(t=>{
    t.px = PAD + (t.px-minPX);
    t.py = PAD + (t.py-minPY);
  });
  return tiles;
}

// 覆盖判定：更高层的牌只要与这张牌「像素矩形有重叠」就挡住它（更接近原版的叠放手感）
function overlaps(u, t){
  return !(u.px >= t.px+CELL_W || u.px+CELL_W <= t.px || u.py >= t.py+CELL_H || u.py+CELL_H <= t.py);
}
function updateClickable(){
  const alive = state.tiles.filter(t=>!t.removed);
  alive.forEach(t=>t.clickable=true);
  for (const t of alive){
    for (const u of alive){
      if (u.layer<=t.layer) continue;
      if (overlaps(u,t)){ t.clickable=false; break; }
    }
  }
}

function faceHTML(type){
  return '<img src="'+TILE_IMAGES[type]+'" alt="" draggable="false" loading="eager" ' +
         'onerror="imgFallback(this,'+type+')">';
}
// 仅当某张图真的加载失败时，才把它替换成 emoji（全局函数，供行内 onerror 调用）
function imgFallback(el, type){
  const s = document.createElement('span');
  s.className = 'emoji';
  s.textContent = TILE_EMOJI[type] || '🐸';
  el.replaceWith(s);
}

function renderBoard(){
  const board = $('board');
  board.innerHTML = '';
  const alive = state.tiles.filter(t=>!t.removed).sort((a,b)=>a.layer-b.layer);
  for (const t of alive){
    const el = document.createElement('div');
    el.className = 'tile' + (t.clickable ? ' clickable' : '');
    el.style.left = t.px+'px';
    el.style.top  = t.py+'px';
    el.style.width  = CELL_W+'px';
    el.style.height = CELL_H+'px';
    el.innerHTML = '<div class="face">'+faceHTML(t.type)+'</div>';
    if (t.clickable){
      el.addEventListener('click', ()=>onTileClick(t));
      el.addEventListener('pointerdown', ()=>{ if(!state.over) el.classList.add('pressed'); });
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>
        el.addEventListener(ev, ()=>el.classList.remove('pressed')));
    }
    t.el = el;
    board.appendChild(el);
  }
}

function renderSlot(){
  const slot = $('slot');
  slot.innerHTML = '';
  for (let i=0;i<SLOT_MAX;i++){
    const d = document.createElement('div');
    d.className = 'slot-cell' + (i<state.slot.length ? ' filled' : '');
    if (i<state.slot.length) d.innerHTML = faceHTML(state.slot[i].type);
    slot.appendChild(d);
  }
}

function renderHUD(){
  const left = state.tiles.filter(t=>!t.removed).length;
  $('stat-left').textContent = left;
  $('stat-cleared').textContent = state.tiles.length - left;
  $('stat-total').textContent = state.tiles.length;
  setUse('undo', state.undosLeft);
  setUse('shuffle', state.shufflesLeft);
  setUse('revive', state.revivesLeft);
}
function setUse(name, n){
  const b = $(name);
  b.querySelector('.use').textContent = n;
  b.classList.toggle('off', n<=0);
}

function fit(){
  const wrap = $('boardWrap');
  const availW = wrap.clientWidth;
  const s = availW / boardW;
  const scale = Math.min(1.4, Math.max(0.4, s));
  const board = $('board');
  board.style.width = boardW+'px';
  board.style.height = boardH+'px';
  board.style.transform = 'scale('+scale+')';
  wrap.style.height = (boardH*scale)+'px';
}

function render(){
  renderBoard();
  renderSlot();
  renderHUD();
  fit();
}

/* ================= 音效 & 震动 ================= */
let audioCtx = null;
let muted = false;
try{ muted = localStorage.getItem('nlw_mute')==='1'; }catch(e){}
function beep(freq, dur, type, gain, when){
  if (muted) return;
  try{
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (audioCtx.state==='suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + (when||0);
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
function sndPick(){ beep(520,0.06,'triangle',0.05); }
function sndMatch(){ beep(660,0.08,'triangle',0.07,0); beep(880,0.09,'triangle',0.06,0.06); beep(1320,0.12,'triangle',0.05,0.12); }
function sndLose(){ beep(220,0.25,'sawtooth',0.05); beep(160,0.3,'sawtooth',0.05,0.12); }
function sndWin(){ [523,659,784,1047].forEach((f,i)=>beep(f,0.18,'triangle',0.07,i*0.09)); }
function buzz(ms){ try{ if (navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* ================= 动画 ================= */
function slotCellEl(i){ return $('slot').children[i]; }

function animateFly(src, dst, type){
  const clone = document.createElement('div');
  clone.className = 'fly-clone';
  clone.innerHTML = faceHTML(type);
  clone.style.width = src.width+'px';
  clone.style.height = src.height+'px';
  clone.style.left = src.left+'px';
  clone.style.top = src.top+'px';
  document.body.appendChild(clone);

  const s = Math.min(1, dst.width/src.width, dst.height/src.height);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    clone.style.left = (dst.left + dst.width/2 - src.width/2)+'px';
    clone.style.top  = (dst.top  + dst.height/2 - src.height/2)+'px';
    clone.style.transform = 'scale('+s+')';
  }));

  setTimeout(()=>{
    clone.style.transition = 'opacity .16s ease';
    clone.style.opacity = '0';
    setTimeout(()=>clone.remove(), 160);
  }, 170);
}

function spawnBurst(rect){
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const colors = ['#ffd54f','#ff9800','#ff7043','#fff176'];
  for (let i=0;i<9;i++){
    const p = document.createElement('i');
    p.className = 'burst';
    const ang = (Math.PI*2*i)/9 + Math.random()*0.5;
    const dist = 22 + Math.random()*24;
    p.style.left = cx+'px';
    p.style.top = cy+'px';
    p.style.background = colors[i%colors.length];
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 430);
  }
}

/* ================= 核心流程 ================= */
// 消除时的弹出鬼影（纯视觉，不阻塞状态）
function spawnMatchGhost(rect, type){
  const g = document.createElement('div');
  g.className = 'match-ghost';
  g.innerHTML = faceHTML(type);
  g.style.left = rect.left+'px';
  g.style.top = rect.top+'px';
  g.style.width = rect.width+'px';
  g.style.height = rect.height+'px';
  document.body.appendChild(g);
  setTimeout(()=>g.remove(), 340);
}

// 同步处理所有可消除的三张：立刻更新状态，动画用鬼影补足（不阻塞连续点击）
function resolveMatchesWithFx(){
  const toRemove = [];
  const counts = new Map();
  state.slot.forEach((s,i)=>counts.set(s.type,(counts.get(s.type)||0)+1));
  for (const [type,count] of counts){
    const rem = Math.floor(count/3)*3;
    let taken = 0;
    for (let i=0;i<state.slot.length && taken<rem;i++){
      if (state.slot[i].type===type){ toRemove.push(i); taken++; }
    }
  }
  if (toRemove.length===0){ checkEnd(); return; }

  const ghosts = [];
  toRemove.forEach(i=>{
    const c = slotCellEl(i);
    if (c) ghosts.push({rect:c.getBoundingClientRect(), type:state.slot[i].type});
  });
  const burstRect = ghosts[1] ? ghosts[1].rect : (ghosts[0] ? ghosts[0].rect : null);

  sndMatch(); buzz(20);
  const set = new Set(toRemove);
  state.slot = state.slot.filter((s,i)=>!set.has(i));
  render();
  ghosts.forEach(g=>spawnMatchGhost(g.rect, g.type));
  if (burstRect) spawnBurst(burstRect);
  checkEnd();
}

function onTileClick(t){
  if (state.over || !t.clickable) return;

  const faceEl = t.el ? t.el.querySelector('.face') : null;
  const srcRect = faceEl ? faceEl.getBoundingClientRect() : null;

  t.removed = true;
  state.slot.push(t);
  updateClickable();
  render();

  sndPick(); buzz(8);

  if (srcRect){
    const cell = slotCellEl(state.slot.length-1);
    const cellRect = cell ? cell.getBoundingClientRect() : null;
    if (cellRect) animateFly(srcRect, cellRect, t.type);
  }

  resolveMatchesWithFx();
}

function checkEnd(){
  const boardLeft = state.tiles.some(t=>!t.removed);
  if (!boardLeft && state.slot.length===0){ win(); return; }
  if (state.slot.length >= SLOT_MAX){ lose(); return; }
}

function win(){
  state.over = true; state.won = true;
  sndWin(); buzz([30,40,30]);
  $('ov-title').textContent = '🎉 通关啦！';
  $('ov-msg').textContent = '你清空了所有牌，太厉害了！';
  $('ov-revive').style.display = 'none';
  $('ov-close').style.display = 'none';
  $('overlay').style.display = 'flex';
}
function lose(){
  state.over = true; state.won = false;
  sndLose(); buzz([40,30,40]);
  $('ov-title').textContent = '😵 卡槽塞满啦！';
  $('ov-msg').textContent = '别灰心，可以复活、洗牌或撤回再试一次~';
  $('ov-revive').style.display = (state.revivesLeft>0) ? '' : 'none';
  $('ov-close').style.display = '';
  $('overlay').style.display = 'flex';
}

function undo(){
  if (state.over || state.undosLeft<=0 || state.slot.length===0) return;
  state.undosLeft--;
  const n = Math.min(3, state.slot.length);
  for (let i=0;i<n;i++){ const t = state.slot.pop(); t.removed = false; }
  updateClickable();
  render();
}

function shuffleTiles(){
  if (state.over || state.shufflesLeft<=0) return;
  state.shufflesLeft--;
  const alive = state.tiles.filter(t=>!t.removed);
  const types = alive.map(t=>t.type);
  shuffleArr(types);
  alive.forEach((t,i)=>t.type=types[i]);
  render();
}

function revive(){
  if (!state.over || state.won || state.revivesLeft<=0) return;
  state.revivesLeft--;
  state.slot = state.slot.slice(3);          // 清掉槽里最早加入的 3 张，腾出空间
  state.over = false;
  $('overlay').style.display = 'none';
  render();
}

function start(levelKey){
  clearFx();
  state.level = levelKey;
  state.tiles = buildLevel(levelKey);
  state.slot = [];
  state.undosLeft = 3;
  state.shufflesLeft = 3;
  state.revivesLeft = 1;
  state.over = false; state.won = false;
  updateClickable();
  render();
  $('overlay').style.display = 'none';
  document.querySelectorAll('.diff-btn').forEach(b=>
    b.classList.toggle('active', b.dataset.level===levelKey));
}

function clearFx(){
  document.querySelectorAll('.fly-clone,.burst,.match-ghost').forEach(e=>e.remove());
}

function warmImages(){
  TILE_IMAGES.forEach(src => { const im = new Image(); im.src = src; });
}

(function init(){
  warmImages();
  document.querySelectorAll('.diff-btn').forEach(b=>b.onclick=()=>start(b.dataset.level));
  $('undo').onclick = undo;
  $('shuffle').onclick = shuffleTiles;
  $('revive').onclick = revive;
  $('restart').onclick = ()=>start(state.level);
  $('ov-restart').onclick = ()=>start(state.level);
  $('ov-revive').onclick = revive;
  $('ov-close').onclick = ()=>$('overlay').style.display='none';
  $('mute').onclick = function(){
    muted = !muted;
    $('mute').textContent = muted ? '🔇' : '🔊';
    try{ localStorage.setItem('nlw_mute', muted?'1':'0'); }catch(e){}
  };
  $('mute').textContent = muted ? '🔇' : '🔊';
  window.addEventListener('resize', fit);
  start('easy');
})();
</script>
